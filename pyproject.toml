[project]
name = "trajectest"
version = "0.1.0"
description = "Test what your LangGraph agent does, not just what it says: tool calls, human-approval interrupts and LLM-judged answers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Mohamed Aziz Balti" }]
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
trajectest = "trajectest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trajectest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
